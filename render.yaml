services:
  - type: web
    name: cloudsentinel-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudsentinel-postgres
          property: connectionString
      - key: CLOUDSENTINEL_ENV
        value: production
      - key: CLOUDSENTINEL_API_TOKEN
        sync: false
      - key: CLOUDSENTINEL_GATEWAY_SECRET
        sync: false
      - key: CLOUDSENTINEL_TARGET_ALLOWLIST
        sync: false
      - key: CLOUDSENTINEL_AUTH_RATE_LIMIT
        value: "10"
      - key: CLOUDSENTINEL_GATEWAY_RATE_LIMIT
        value: "120"
      - key: CLOUDSENTINEL_CHECK_RATE_LIMIT
        value: "60"
      - key: CLOUDSENTINEL_SCHEDULE_RATE_LIMIT
        value: "20"
      - key: CLOUDSENTINEL_REPUTATION_RATE_LIMIT
        value: "30"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ALERT_EMAIL_DEV_MODE
        value: "true"

  - type: worker
    name: cloudsentinel-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.api.worker
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudsentinel-postgres
          property: connectionString
      - key: CLOUDSENTINEL_ENV
        value: production
      - key: CLOUDSENTINEL_TARGET_ALLOWLIST
        sync: false
      - key: ALERT_EMAIL_DEV_MODE
        value: "true"
      - key: ALERT_EMAIL_ON_RESOLVE
        value: "false"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: ALERT_EMAIL_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: cloudsentinel-postgres
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    databaseName: cloudsentinel
    user: sentinel
    ipAllowList: []

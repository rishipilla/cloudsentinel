
[project]
name = "cloudsentinel"
version = "0.1.0"
description = "CloudSentinel cloud monitoring dashboard and API"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.4",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "services.api.main:app"
